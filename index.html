<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>التقويم المدرسي للعام ٢٠٢٦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ================= Tokens ================= */
:root{
  --bg:#FAF7EF; --surface:#FFFFFF; --surface-2:#F3EEE1; --surface-3:#EAF1EC;
  --ink:#14231C; --ink-2:#2E3D35; --muted:#5A675F; --line:#E5DDCA; --line-2:#D6CCB4;
  --green:#0E3B2C; --green-2:#185040; --green-3:#2A6A54; --on-green:#F7F3E8; --on-green-2:#C9D5CD;
  --gold:#86661F; --gold-line:#C2A465; --gold-soft:#F1E7CC;
  --btn-bg:#185040; --btn-ink:#FFFFFF; --btn-hover:#0E3B2C;
  --focus:#B8913F;
  --shadow-1:0 1px 2px rgba(14,59,44,.06),0 4px 14px -6px rgba(14,59,44,.12);
  --shadow-2:0 2px 4px rgba(14,59,44,.06),0 18px 36px -18px rgba(14,59,44,.32);
  --r-sm:10px; --r-md:14px; --r-lg:20px;
  --fs-xs:.8125rem; --fs-sm:.9375rem; --fs-base:1.0625rem; --fs-md:1.1875rem;
  --fs-lg:clamp(1.3rem,1.15rem + .6vw,1.6rem);
  --fs-xl:clamp(1.6rem,1.3rem + 1.2vw,2.25rem);
  --fs-2xl:clamp(1.75rem,1.35rem + 1.6vw,2.6rem);
  --sidebar:292px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1F18; --surface:#11291F; --surface-2:#173328; --surface-3:#173328;
    --ink:#F0EBDD; --ink-2:#DCD6C6; --muted:#AEB9B1; --line:#244237; --line-2:#2F5245;
    --green:#071811; --green-2:#1F5C48; --green-3:#2A6A54; --on-green:#F0EBDD; --on-green-2:#B9C6BD;
    --gold:#D6B670; --gold-line:#A88C4E; --gold-soft:#2E3A27;
    --btn-bg:#D6B670; --btn-ink:#10211A; --btn-hover:#E3C887;
    --focus:#E3C887;
    --shadow-1:0 1px 2px rgba(0,0,0,.3); --shadow-2:0 18px 36px -18px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1F18; --surface:#11291F; --surface-2:#173328; --surface-3:#173328;
  --ink:#F0EBDD; --ink-2:#DCD6C6; --muted:#AEB9B1; --line:#244237; --line-2:#2F5245;
  --green:#071811; --green-2:#1F5C48; --green-3:#2A6A54; --on-green:#F0EBDD; --on-green-2:#B9C6BD;
  --gold:#D6B670; --gold-line:#A88C4E; --gold-soft:#2E3A27;
  --btn-bg:#D6B670; --btn-ink:#10211A; --btn-hover:#E3C887;
  --focus:#E3C887;
  --shadow-1:0 1px 2px rgba(0,0,0,.3); --shadow-2:0 18px 36px -18px rgba(0,0,0,.7);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans Arabic","Tajawal","Segoe UI",Tahoma,Arial,sans-serif;
  font-size:var(--fs-base);line-height:1.85;overflow-x:hidden;text-rendering:optimizeLegibility}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3{line-height:1.45;margin:0;font-weight:700}
p{margin:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:8px}
button{font:inherit;color:inherit}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;top:-60px;right:16px;z-index:100;background:var(--btn-bg);color:var(--btn-ink);padding:10px 16px;border-radius:var(--r-sm);text-decoration:none;font-weight:600}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 12px)}

/* ================= Shell ================= */
.shell{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);min-height:100vh}
.sidebar{background:var(--green);color:var(--on-green);position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;padding:30px 16px 22px;overflow-y:auto;border-inline-end:1px solid rgba(194,164,101,.25)}
.brand{display:flex;gap:12px;align-items:center;padding:0 10px 22px;margin-bottom:14px;border-bottom:1px solid rgba(240,235,221,.12)}
.brand .seal{flex:none;width:42px;height:42px;border-radius:12px;border:1px solid rgba(194,164,101,.55);display:grid;place-items:center;color:#D8BC7C}
.brand small{display:block;color:var(--on-green-2);font-size:var(--fs-xs);line-height:1.6}
.brand strong{display:block;font-size:.98rem;font-weight:600;line-height:1.55;color:#fff}
.nav{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.nav a{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-sm);
  text-decoration:none;font-size:var(--fs-sm);line-height:1.65;color:var(--on-green-2);position:relative}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a[aria-current="page"]{background:rgba(240,235,221,.11);color:#fff;font-weight:600}
.nav a[aria-current="page"]::before{content:"";position:absolute;inset-inline-start:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:#D8BC7C}
.nav .num{flex:none;width:1.4em;color:#D8BC7C;font-weight:600;text-align:center}
.nav .ico{flex:none;width:1.4em;display:grid;place-items:center;margin-top:3px;color:#D8BC7C}
.nav-sub{list-style:none;margin:2px 0 6px;padding:0 0 0 0;padding-inline-start:34px;display:grid;gap:2px;position:relative}
.nav-sub::before{content:"";position:absolute;inset-block:4px;inset-inline-start:22px;width:1px;background:rgba(216,188,124,.35)}
.nav-sub a{padding:7px 12px;font-size:var(--fs-xs);border-radius:8px}
.nav a.in-section{color:#fff;font-weight:600}
.nav .home-link{margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid rgba(240,235,221,.08)}
.side-foot{margin-top:auto;padding:18px 12px 0;font-size:var(--fs-xs);color:var(--on-green-2);display:flex;gap:8px;align-items:center}
.side-close{display:none}

.topbar{display:none}
.main{min-width:0;display:flex;flex-direction:column}
.masthead{padding:30px clamp(20px,4vw,56px) 0;max-width:1320px;width:100%}
.masthead h1{font-size:var(--fs-2xl);color:var(--green);letter-spacing:0;line-height:1.35}
:root[data-theme="dark"] .masthead h1{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .masthead h1{color:var(--ink)}}
.masthead .rule{display:flex;align-items:center;gap:0;margin-top:14px}
.masthead .rule::before{content:"";height:3px;width:56px;background:var(--gold-line);border-radius:2px}
.masthead .rule::after{content:"";height:1px;flex:1;background:var(--line)}
.masthead.compact h1{font-size:clamp(1.2rem,1.05rem + .6vw,1.5rem);color:var(--muted);font-weight:600}
.content{padding:30px clamp(20px,4vw,56px) 72px;flex:1;max-width:1320px;width:100%}
.content:focus{outline:none}
.site-foot{padding:22px clamp(20px,4vw,56px);border-top:1px solid var(--line);color:var(--muted);font-size:var(--fs-sm)}

/* ================= Buttons ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:var(--r-sm);
  font-weight:600;font-size:var(--fs-sm);text-decoration:none;cursor:pointer;border:1.5px solid transparent;line-height:1.4;text-align:center;
  transition:background-color .15s,border-color .15s,color .15s}
.btn-primary{background:var(--btn-bg);color:var(--btn-ink)}
.btn-primary:hover{background:var(--btn-hover)}
.btn-ghost{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.btn-ghost:hover{border-color:var(--gold-line);background:var(--surface-2)}
.btn svg{flex:none}
.btn-sm{min-height:42px;padding:8px 14px;font-size:var(--fs-sm)}

/* ================= Home: hero ================= */
.hero{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.15fr);gap:clamp(28px,4.5vw,72px);align-items:center}
.hero-text h2{font-size:var(--fs-xl);color:var(--ink);margin-bottom:14px}
.hero-text p{font-size:clamp(1.06rem,1rem + .35vw,1.25rem);color:var(--muted);max-width:32ch;line-height:1.95}
.hero-actions{margin-top:28px;display:flex;flex-wrap:wrap;gap:12px}

.photo-col{min-width:0}
.photo-frame{position:relative;margin:0;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-2)}
.photo-frame::before,.photo-frame::after{content:"";position:absolute;width:38px;height:38px;pointer-events:none}
.photo-frame::before{top:-7px;left:-7px;border-top:2px solid var(--gold-line);border-left:2px solid var(--gold-line);border-top-left-radius:14px}
.photo-frame::after{bottom:-7px;right:-7px;border-bottom:2px solid var(--gold-line);border-right:2px solid var(--gold-line);border-bottom-right-radius:14px}
.photo-frame img{width:100%;aspect-ratio:1280/712;object-fit:cover;object-position:center 42%;border-radius:12px;background:var(--surface-2)}
.school-card{margin-top:16px;background:var(--green);color:var(--on-green);border-radius:var(--r-md);padding:16px 20px;display:flex;gap:16px;align-items:center}
.school-card .seal{flex:none;width:46px;height:46px;border-radius:12px;border:1px solid rgba(194,164,101,.6);display:grid;place-items:center;color:#D8BC7C}
.school-card .auth{color:var(--on-green-2);font-size:var(--fs-sm);line-height:1.7}
.school-card .name{font-weight:700;font-size:var(--fs-md);line-height:1.6;color:#fff}

/* ================= Home: sections ================= */
.section{margin-top:clamp(56px,7vw,92px);scroll-margin-top:90px}
.section-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:10px 20px;margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.section-head h2{font-size:var(--fs-lg)}
.section-head h2:focus{outline:none}
.section-head p{color:var(--muted);font-size:var(--fs-sm)}

.perf{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(14px,3vw,32px);box-shadow:var(--shadow-1);display:grid;place-items:center}
.perf-img{border:0;padding:clamp(8px,2vw,20px);background:#fff;cursor:zoom-in;border-radius:var(--r-md);width:100%;max-width:640px}
.perf-img img{width:100%;height:auto;margin:0 auto}

.domains{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (min-width:1560px){.domains{grid-template-columns:repeat(4,minmax(0,1fr))}}
.domain-card{--lift:0px;position:relative;display:flex;flex-direction:column;min-width:0;text-decoration:none;color:inherit;
  background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;isolation:isolate;
  box-shadow:var(--shadow-1);transform:translateY(var(--lift));
  transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .35s}
.domain-card:hover,.domain-card:focus-visible{--lift:-6px;box-shadow:0 26px 48px -24px rgba(14,59,44,.45);border-color:var(--gold-line)}
.domain-card:focus-visible{outline:3px solid var(--focus);outline-offset:4px;border-radius:22px}
.domain-card:active{--lift:-2px}
.domain-card{--band:118px}
.dc-band{position:relative;height:var(--band);background:linear-gradient(140deg,#0E3B2C 0%,#185040 62%,#245F4B 100%);overflow:hidden}
.dc-band::before{content:"";position:absolute;inset:0;opacity:.18;
  background-image:linear-gradient(45deg,rgba(216,188,124,.9) 1px,transparent 1px),linear-gradient(-45deg,rgba(216,188,124,.9) 1px,transparent 1px);
  background-size:22px 22px;mask-image:linear-gradient(to left,#000 0%,transparent 75%);-webkit-mask-image:linear-gradient(to left,#000 0%,transparent 75%)}
.dc-band::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.14) 50%,transparent 70%);
  transform:translateX(120%);transition:transform .8s ease}
.domain-card:hover .dc-band::after,.domain-card:focus-visible .dc-band::after{transform:translateX(-120%)}
.dc-num{position:absolute;left:18px;bottom:-22px;font-size:6.2rem;font-weight:700;line-height:1;color:transparent;
  -webkit-text-stroke:1.5px rgba(216,188,124,.55);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.domain-card:hover .dc-num,.domain-card:focus-visible .dc-num{transform:translateY(-8px)}
.dc-ic{position:absolute;right:20px;top:calc(var(--band) - 30px);width:60px;height:60px;border-radius:18px;background:var(--surface);color:var(--green-2);
  display:grid;place-items:center;box-shadow:0 10px 22px -10px rgba(14,59,44,.5);border:1px solid var(--line);z-index:1;
  transition:transform .4s cubic-bezier(.2,.8,.2,1),background-color .3s,color .3s}
.domain-card:hover .dc-ic,.domain-card:focus-visible .dc-ic{transform:translateY(-4px) rotate(-6deg);background:var(--gold-soft)}
.dc-body{position:relative;padding:40px 22px 0;display:flex;flex-direction:column;gap:12px;flex:1}
.dc-chips{margin-bottom:8px}
.dc-idx{font-size:var(--fs-xs);font-weight:600;color:var(--gold)}
.domain-card h3{font-size:var(--fs-md);color:var(--ink);line-height:1.5}
.dc-chips{display:flex;flex-wrap:wrap;gap:8px}
.dc-chip{display:inline-flex;align-items:baseline;gap:6px;padding:4px 12px;border-radius:999px;background:var(--surface-2);font-size:var(--fs-xs);color:var(--ink-2);line-height:1.8}
.dc-chip b{font-size:.98rem;color:var(--green-2)}
.dc-cta{margin:auto -22px 0;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;gap:10px;
  border-top:1px solid var(--line);font-weight:600;font-size:var(--fs-sm);color:var(--green-2);position:relative;overflow:hidden;z-index:0}
.dc-cta::before{content:"";position:absolute;inset:0;background:var(--green-2);transform:scaleX(0);transform-origin:right;transition:transform .4s cubic-bezier(.2,.8,.2,1);z-index:-1}
.domain-card:hover .dc-cta,.domain-card:focus-visible .dc-cta{color:#fff}
.domain-card:hover .dc-cta::before,.domain-card:focus-visible .dc-cta::before{transform:scaleX(1)}
.dc-arrow{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;border:1.5px solid currentColor;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.domain-card:hover .dc-arrow,.domain-card:focus-visible .dc-arrow{transform:translateX(-5px)}
:root[data-theme="dark"] .dc-ic{color:var(--gold)}
:root[data-theme="dark"] .dc-chip b,:root[data-theme="dark"] .dc-cta{color:var(--gold)}
:root[data-theme="dark"] .dc-cta::before{background:var(--gold)}
:root[data-theme="dark"] .domain-card:hover .dc-cta,:root[data-theme="dark"] .domain-card:focus-visible .dc-cta{color:#10211A}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .dc-ic{color:var(--gold)}
  :root:not([data-theme="light"]) .dc-chip b,:root:not([data-theme="light"]) .dc-cta{color:var(--gold)}
  :root:not([data-theme="light"]) .dc-cta::before{background:var(--gold)}
  :root:not([data-theme="light"]) .domain-card:hover .dc-cta,:root:not([data-theme="light"]) .domain-card:focus-visible .dc-cta{color:#10211A}
}
/* دخول البطاقات مرة واحدة عند عرض القسم */
.domains.reveal .domain-card{opacity:0;transform:translateY(22px)}
.domains.reveal.in .domain-card{opacity:1;transform:translateY(var(--lift));
  transition:opacity .6s ease var(--d,0s),transform .6s cubic-bezier(.2,.8,.2,1) var(--d,0s),box-shadow .35s,border-color .35s}
.domains.reveal.in.done .domain-card{transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .35s}

/* ================= Inner pages ================= */
.crumbs{font-size:var(--fs-sm);color:var(--muted);margin-bottom:14px}
.crumbs ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 8px}
.crumbs li{display:flex;align-items:center;gap:8px}
.crumbs li+li::before{content:"";width:6px;height:6px;border-top:1.5px solid var(--gold-line);border-left:1.5px solid var(--gold-line);transform:rotate(-45deg)}
.crumbs a{text-decoration:none;padding:4px 0}
.crumbs a:hover{color:var(--ink);text-decoration:underline}
.crumbs [aria-current]{color:var(--ink);font-weight:600}
.page-title{font-size:var(--fs-xl);margin-bottom:20px}
.page-title:focus{outline:none}
.lede{color:var(--muted);margin:0 0 24px;max-width:68ch}

.empty{border:1.5px dashed var(--line-2);border-radius:var(--r-lg);padding:clamp(28px,5vw,52px) 20px;text-align:center;color:var(--muted);background:var(--surface)}
.empty .em-ic{width:56px;height:56px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--gold)}
.empty strong{display:block;color:var(--ink);font-size:var(--fs-md);margin-bottom:4px}
.stack{display:grid;gap:16px}
.label-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:20px 22px;box-shadow:var(--shadow-1)}
.label-card h3{font-size:var(--fs-md);color:var(--green-2);margin-bottom:6px}
:root[data-theme="dark"] .label-card h3{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .label-card h3{color:var(--gold)}}
.label-card p{color:var(--ink-2);white-space:pre-line}
.label-card .muted{color:var(--muted)}
.link-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}

/* ================= Reading pages ================= */
.prose{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-1);
  padding:clamp(24px,4.5vw,52px) clamp(20px,5vw,60px);position:relative;max-width:900px}
.prose::before{content:"";position:absolute;top:0;inset-inline-start:clamp(20px,5vw,60px);width:72px;height:3px;background:var(--gold-line);border-radius:0 0 3px 3px}
.prose p{font-size:clamp(1.1rem,1rem + .35vw,1.28rem);line-height:2.15;color:var(--ink);font-weight:400;max-width:68ch}
.prose p+p{margin-top:1.1em}
.vm-title{margin-bottom:22px}
.vm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.vm-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-1);
  padding:clamp(22px,3.5vw,36px);display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.vm-card::before{content:"";position:absolute;top:0;inset-inline:0;height:4px;background:linear-gradient(to left,var(--green-2),var(--gold-line))}
.vm-head{display:flex;align-items:center;gap:12px}
.vm-ic{flex:none;width:48px;height:48px;border-radius:14px;background:var(--green);color:#D8BC7C;display:grid;place-items:center}
.vm-head h3{font-size:var(--fs-lg);color:var(--ink)}
.vm-card p{font-size:clamp(1.08rem,1rem + .3vw,1.22rem);line-height:2.05;color:var(--ink-2)}
.values-head{display:flex;align-items:center;gap:12px;margin:clamp(32px,5vw,48px) 0 18px}
.values-head h3{font-size:var(--fs-lg)}
.values-head::after{content:"";flex:1;height:1px;background:var(--line)}
.values{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.value{grid-column:span 2}
.value:nth-child(4),.value:nth-child(5){grid-column:span 3}
@media (max-width:1100px){.values{grid-template-columns:repeat(2,minmax(0,1fr))}.value,.value:nth-child(4){grid-column:span 1}.value:nth-child(5){grid-column:1 / -1}}
@media (max-width:640px){.values{grid-template-columns:minmax(0,1fr)}.value:nth-child(5){grid-column:auto}}
.value{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:22px 22px 20px;box-shadow:var(--shadow-1);
  display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"n h" "p p";gap:12px 14px;align-items:center;align-content:start;transition:border-color .25s,box-shadow .25s,transform .25s}
.value:hover{border-color:var(--gold-line);box-shadow:var(--shadow-2);transform:translateY(-3px)}

/* ملفات التشكيلات: تفرعات متداخلة */
.fm-root{margin:0 0 18px}
.fm-leaf{cursor:default}
.fm-leaf:hover{background:transparent}
.fm-sub{margin-top:10px;gap:10px;padding-inline-start:clamp(10px,2.5vw,18px);border-inline-start:2px solid var(--gold-line)}

.fm-sub .std-num{width:32px;height:32px;font-size:.9rem}

.inds{list-style:none;margin:0;padding:10px 0 4px;display:grid;gap:12px;position:relative;counter-reset:none}
.inds::before{content:"";position:absolute;top:30px;bottom:30px;right:21px;width:2px;border-radius:2px;
  background:linear-gradient(to bottom,var(--gold-line),color-mix(in srgb,var(--gold-line) 25%,transparent))}
.ind{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;align-items:start;position:relative}
.ind[hidden]{display:none}
.ind-num{position:relative;z-index:1;width:44px;height:44px;border-radius:50%;background:var(--surface);border:2px solid var(--gold-line);
  color:var(--gold);display:grid;place-items:center;font-weight:700;font-size:1.05rem;margin-top:10px;
  box-shadow:0 0 0 5px var(--bg);transition:background-color .25s,color .25s}
.ind-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 22px;
  display:flex;gap:18px;align-items:center;justify-content:space-between;min-width:0;
  transition:border-color .25s,box-shadow .25s,transform .25s}
.ind-card::before{content:"";position:absolute;top:22px;right:-7px;width:12px;height:12px;background:var(--surface);
  border-right:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg);transition:border-color .25s}
.ind:hover .ind-card{border-color:var(--gold-line);box-shadow:var(--shadow-2)}
.ind:hover .ind-card::before{border-color:var(--gold-line)}
.ind:hover .ind-num{background:var(--green-2);color:#fff;border-color:var(--green-2)}
:root[data-theme="dark"] .ind:hover .ind-num{background:var(--gold);color:#10211A;border-color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ind:hover .ind-num{background:var(--gold);color:#10211A;border-color:var(--gold)}}
.ind-body{min-width:0;flex:1}
.ind-code{display:inline-block;font-weight:700;color:var(--gold);font-size:var(--fs-sm);margin-bottom:4px}
.ind-text{color:var(--ink);font-size:clamp(1.08rem,1rem + .3vw,1.22rem);font-weight:500;line-height:1.95;overflow-wrap:anywhere;text-wrap:pretty}
.ev-btn{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:999px;border:1px solid var(--line-2);
  background:var(--surface-3);color:var(--green-2);text-decoration:none;font-size:var(--fs-sm);font-weight:600;white-space:nowrap;line-height:1.4;
  transition:background-color .2s,color .2s,border-color .2s}
.ev-btn:hover{background:var(--green-2);color:#fff;border-color:var(--green-2)}
:root[data-theme="dark"] .ev-btn{color:var(--gold)}
:root[data-theme="dark"] .ev-btn:hover{background:var(--gold);color:#10211A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ev-btn{color:var(--gold)}:root:not([data-theme="light"]) .ev-btn:hover{background:var(--gold);color:#10211A}}
.ind-note{color:var(--muted);font-size:var(--fs-sm);padding:14px 4px}
.pill{display:inline-flex;align-items:center;padding:4px 12px;border-radius:999px;font-size:var(--fs-xs);background:var(--gold-soft);color:var(--ink-2);line-height:1.7}

.files{margin-top:14px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
.files h4{margin:0;font-size:var(--fs-sm);font-weight:700;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.files h4 span{color:var(--muted);font-weight:500}
.files ul{list-style:none;margin:0;padding:6px 8px}
.files li[hidden]{display:none}
.files a{display:flex;gap:10px;align-items:center;padding:10px 8px;border-radius:8px;text-decoration:none;font-size:var(--fs-sm);line-height:1.6;min-height:44px}
.files a:hover{background:var(--surface-2)}
.files a .t{flex:1;min-width:0;overflow-wrap:anywhere}
.files a svg{flex:none;color:var(--muted)}

.no-results{display:none}
.no-results.show{display:block}
.back-row{margin-top:28px;display:flex;flex-wrap:wrap;gap:12px}
.source-line{margin-top:28px;color:var(--muted);font-size:var(--fs-sm);display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.source-line a{color:var(--green-2);font-weight:600}
:root[data-theme="dark"] .source-line a{color:var(--gold)}

.lock{max-width:620px;margin:20px auto 0}

/* ================= Lightbox ================= */
dialog.lightbox{border:0;padding:0;max-width:none;max-height:none;width:100vw;height:100%;margin:0;background:rgba(4,18,13,.94);color:#fff}

.lb-bar{position:fixed;top:0;inset-inline:0;display:flex;justify-content:space-between;align-items:center;gap:10px;

@media (max-width:980px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .topbar{display:flex;position:sticky;top:0;z-index:30;align-items:center;gap:12px;

  .sidebar{position:fixed;top:0;bottom:0;right:0;width:min(86vw,330px);height:100%;z-index:50;transform:translateX(105%);
    transition:transform .25s ease,visibility 0s linear .25s;visibility:hidden;box-shadow:-20px 0 40px rgba(0,0,0,.25);
    padding-top:calc(env(safe-area-inset-top,0px) + 20px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}
  .sidebar.open{transform:none;visibility:visible;transition:transform .25s ease}

  .scrim.show{opacity:1;pointer-events:auto}
  .side-close{display:grid;position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:12px}
  .brand{padding-inline-end:56px}
  .masthead{padding-top:22px}
  .masthead.compact{display:none}
  .hero{grid-template-columns:minmax(0,1fr)}

}
@media (max-width:640px){
  body{font-size:1rem}
  .content{padding-top:22px}
  .domains{grid-template-columns:minmax(0,1fr);gap:14px}
  .domain-card{--band:100px}
  .dc-num{font-size:5.2rem}

  .photo-frame{padding:7px}
  .school-card{padding:14px 16px;gap:12px}
  .school-card .seal{width:40px;height:40px}
  .domain-head{padding:18px 16px;gap:14px}
  .domain-head .ic{width:48px;height:48px;border-radius:13px}
  .domain-head .actions .btn{flex:1 1 100%}
  .std-head{flex-direction:column}
  .std-toggle{padding:14px 14px;gap:12px}
  .std-link{border-inline-start:0;border-top:1px dashed var(--line);padding:8px 14px 12px;padding-inline-start:64px}
  .std-link .btn{min-height:42px;padding-inline:12px}
  .inds::before{right:17px}
  .ind{grid-template-columns:36px minmax(0,1fr);gap:10px}
  .ind-num{width:36px;height:36px;font-size:.95rem;margin-top:12px;box-shadow:0 0 0 4px var(--bg)}
  .ind-card{flex-direction:column;align-items:stretch;gap:12px;padding:14px 16px}
  .ind-card::before{top:20px}
  .ind-text{font-size:1.06rem;line-height:1.9}
  .ev-btn{align-self:flex-start}
}
@media (max-width:370px){
  .std-link{padding-inline-start:14px}
  .std-num{width:34px;height:34px}

}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media print{.sidebar,.topbar,.scrim{display:none}.shell{display:block}.std-panel[hidden]{display:block}}

<!-- البيانات المنشورة فقط: لا مسودات ولا تعليمات دمج. -->
<script type="application/json" id="evaluation-data"></script>
<script>window.__ASSETS__ = {};</script>
<script>window.__PDFS__ = {};</script>
<script>
"use strict";
/* ================= طبقة البيانات (منفصلة عن العرض) =================
   النسخة الحالية: تقرأ evaluation-data.json المنشور مع الموقع (لقطة وقت الاستخراج، ليست مزامنة حية).
   عند تفعيل المسؤول لاحقًا: تُستبدل getPublished() بقراءة وثيقة published من قاعدة البيانات. */
const DataSource = {
  async getPublished(){
    const el = document.getElementById("evaluation-data");
    if (el && el.textContent.trim().startsWith("{")) return JSON.parse(el.textContent);
    const r = await fetch("data/evaluation-data.json", {cache:"no-cache"});
    if (!r.ok) throw new Error("تعذر تحميل بيانات الموقع");
    return r.json();
  }
};
const ADMIN_ENABLED = false; // ثابت؛ لا يمنح أي صلاحية، والأمان يُفرض على الخادم عند التفعيل.

const asset = p => (window.__ASSETS__ && window.__ASSETS__[p]) || p;
const AR = "٠١٢٣٤٥٦٧٨٩";
const ar = n => String(n).replace(/[0-9]/g, d => AR[d]);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const norm = s => String(s||"").replace(/[\u064B-\u0652\u0640]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه")
  .replace(/[٠-٩]/g, d => AR.indexOf(d)).replace(/\s+/g," ").toLowerCase().trim();
const byOrder = arr => [...(arr||[])].sort((a,b)=>(a.order??0)-(b.order??0));
const hasText = v => typeof v === "string" && v.trim() !== "" && v.trim().toLowerCase() !== "null";
/* صيغ العدد العربية */
function count(n, [one, two, few, many]){
  if(n===1) return one; if(n===2) return two;
  const m = n % 100;
  return (m>=3 && m<=10) ? `${ar(n)} ${few}` : `${ar(n)} ${many}`;
}
const W_STD = ["معيار واحد","معياران","معايير","معيارًا"];
const W_IND = ["مؤشر واحد","مؤشران","مؤشرات","مؤشرًا"];
const W_FILE = ["ملف واحد","ملفان","ملفات","ملفًا"];

const S = (p, w=24, sw=1.7) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICONS = {
  building: w=>S('<path d="M3 21h18M5 21V8l7-4 7 4v13M9 21v-5h6v5M9 11h.01M15 11h.01"/>',w),
  book:     w=>S('<path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5zM12 6.5v13"/>',w),
  growth:   w=>S('<path d="M4 20h16M6 16l4-4 3 3 5-6"/><path d="M14 9h4v4"/>',w),
  shield:   w=>S('<path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/>',w),
  doc:      w=>S('<path d="M14 3H6v18h12V7l-4-4z"/><path d="M14 3v4h4M9 13h6M9 17h4"/>',w),
  folder:   w=>S('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>',w,1.8),
  ext:      w=>S('<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',w,2),
  zoom:     w=>S('<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4M11 8v6M8 11h6"/>',w,2),
  info:     w=>S('<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',w,2),
  lock:     w=>S('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',w),
  search:   w=>S('<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',w,2),
  x:        w=>S('<path d="M6 6l12 12M18 6L6 18"/>',w,2),
  chev:     w=>S('<path d="M6 9l6 6 6-6"/>',w,2),
  arrowL:   w=>S('<path d="M19 12H5M11 6l-6 6 6 6"/>',w,2),
  back:     w=>S('<path d="M5 12h14M13 6l6 6-6 6"/>',w,2),
  home:     w=>S('<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',w,1.8),
  image:    w=>S('<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>',w,1.8),
  file:     w=>S('<path d="M14 3H6v18h12V7l-4-4z"/><path d="M14 3v4h4"/>',w,1.8),
  eye:      w=>S('<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',w),
  flag:     w=>S('<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',w),
  arrowUp:  w=>S('<path d="M12 19V5M6 11l6-6 6 6"/>',w,2),
  award:    w=>S('<circle cx="12" cy="9" r="6"/><path d="M8.5 14L7 21l5-3 5 3-1.5-7"/>',w)
};
const ic = (name, w=24) => (ICONS[name]||ICONS.doc)(w);

/* ترتيب القائمة النهائي */
const NAV = [
  {route:"intro",           key:"intro"},
  {route:"vision",          key:"vision"},
  {route:"achievements",    key:"achievements"},
  {route:"report-1",        key:"report1"},
  {route:"plan-1",          key:"plan1"},
  {route:"self-evaluation", key:"self2"},
  {route:"plan-2",          key:"plan2"},
  {route:"tests",           key:"tests", sub:true}
];
const ROUTE_BY_KEY = Object.fromEntries(NAV.map(n=>[n.key,n.route]));

let DATA = null;
const view = document.getElementById("view");
const ext = 'target="_blank" rel="noopener noreferrer"';

/* ================= القائمة ================= */
function renderNav(){
  const items = [`<li class="home-link"><a href="#/" data-route=""><span class="ico">${ic("home",18)}</span><span>الرئيسية</span></a></li>`]
    .concat(NAV.map((n,i)=>{
      const pg = DATA.pages[n.key]; if(!pg) return "";
      const subs = n.sub && pg.years ? `<ul class="nav-sub">${pg.years.map(y=>`<li><a href="#/${n.route}/${esc(y.year)}" data-route="${n.route}/${esc(y.year)}">${esc(y.label)}</a></li>`).join("")}</ul>` : "";
      return `<li${subs?' class="has-sub"':''}><a href="#/${n.route}" data-route="${n.route}"><span class="num">${ar(i+1)}</span><span>${esc(pg.title||"")}</span></a>${subs}</li>`;
    }));
  document.getElementById("nav").innerHTML = items.join("");
  document.getElementById("brandAuth").textContent = DATA.school.authority;
  document.getElementById("brandName").textContent = DATA.school.name;
  document.getElementById("topTitle").textContent = DATA.school.name;
  document.getElementById("siteTitle").textContent = DATA.meta.siteTitle;
  document.getElementById("foot").textContent = `${DATA.school.name} — ${DATA.school.authority}`;
}
function setActive(section){
  document.querySelectorAll("#nav a").forEach(a=>{
    const r = a.dataset.route;
    r === section ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current");
    a.classList.toggle("in-section", !!section && r !== "" && r !== section && section.startsWith(r + "/"));
  });
}

/* ================= مكونات عامة ================= */
const emptyState = (title, text, icon="doc") =>
  `<div class="empty"><div class="em-ic">${ic(icon,26)}</div><strong>${esc(title)}</strong>${text?`<p>${esc(text)}</p>`:""}</div>`;
const crumbs = list => `<nav class="crumbs" aria-label="مسار التنقل"><ol>${list.map((c,i)=>
  i<list.length-1 ? `<li><a href="${c.href}">${esc(c.label)}</a></li>` : `<li><span aria-current="page">${esc(c.label)}</span></li>`).join("")}</ol></nav>`;
const domainStats = d => {
  const groups = d.groups||[];
  return { stds: groups.length, inds: groups.reduce((s,g)=>s+(g.indicators||[]).length,0) };
};

function pageContent(key){
  const pg = DATA.pages[key] || {};
  const parts = [];
  if (hasText(pg.body)) parts.push(`<article class="prose">${pg.body.split(/\n\s*\n/).map(t=>`<p>${esc(t.trim())}</p>`).join("")}</article>`);
  if (pg.links && pg.links.length) parts.push(`<div class="stack">${pg.links.map(l=>`
    <div class="label-card link-row"><div><h3>${esc(l.title)}</h3>${hasText(l.note)?`<p class="muted">${esc(l.note)}</p>`:""}</div>
      <a class="btn btn-ghost" href="${esc(l.url)}" ${ext}>${ic("ext",18)}<span>فتح المستند</span></a></div>`).join("")}</div>`);
  const icon = key==="achievements" ? "award" : "doc";
  return `${crumbs([{label:"الرئيسية",href:"#/"},{label:pg.title}])}
    <h2 class="page-title" tabindex="-1">${esc(pg.title)}</h2>

function bindReveal(){
  const g = document.getElementById("domainGrid"); if(!g) return;
  const finish = ()=>{ g.classList.add("in"); setTimeout(()=>g.classList.add("done"), 1000); };
  if (matchMedia("(prefers-reduced-motion: reduce)").matches || !("IntersectionObserver" in window)) { g.classList.add("in","done"); return; }
  const io = new IntersectionObserver(es=>{ if(es.some(e=>e.isIntersecting)){ io.disconnect(); finish(); } }, {threshold:.15});
  io.observe(g);
  g.addEventListener("focusin", ()=>{ io.disconnect(); g.classList.add("in","done"); }, {once:true});
}
function setStd(sec, open){
  const btn = sec.querySelector(".std-toggle"), panel = sec.querySelector(".std-panel");
  btn.setAttribute("aria-expanded", String(open)); panel.hidden = !open; sec.classList.toggle("open", open);
}
function bindDomain(){
  const root = document.getElementById("stds"); if(!root) return;
  const secs = [...root.querySelectorAll(".std")];
  const toggleAll = document.getElementById("toggleAll");
  const syncAll = () => { const allOpen = secs.filter(s=>!s.hidden).every(s=>s.classList.contains("open"));
    toggleAll.textContent = allOpen ? "إغلاق جميع المعايير" : "فتح جميع المعايير"; toggleAll.setAttribute("aria-pressed", String(allOpen)); };
  /* الضغط على العنوان فقط يفتح/يغلق؛ زر المجلد خارج زر الفتح فلا يتداخل معه */
  root.addEventListener("click", e=>{
    const t = e.target.closest(".std-toggle"); if(!t) return;
    const sec = t.closest(".std"); setStd(sec, !sec.classList.contains("open")); syncAll();
  });
  toggleAll.addEventListener("click", ()=>{ const open = toggleAll.getAttribute("aria-pressed")!=="true"; secs.filter(s=>!s.hidden).forEach(s=>setStd(s,open)); syncAll(); });

  const q = document.getElementById("q"), clr = document.getElementById("qClear");
  const noRes = document.getElementById("noRes"), status = document.getElementById("qStatus");
  const run = ()=>{
    const term = norm(q.value);
    clr.classList.toggle("show", !!q.value);
    let hitStd = 0, hitInd = 0;
    secs.forEach(sec=>{
      const items = [...sec.querySelectorAll(".ind, .files li")];
      if(!term){ sec.hidden=false; items.forEach(i=>i.hidden=false); return; }
      const selfHit = sec.dataset.search.includes(term);
      let anyChild = false;
      items.forEach(i=>{ const h = i.dataset.search.includes(term); i.hidden = !(h||selfHit); if(h){ anyChild = true; if(i.classList.contains("ind")) hitInd++; } });
      const files = sec.querySelector(".files");
      if(files) files.hidden = !selfHit && ![...files.querySelectorAll("li")].some(li=>!li.hidden);
      const show = selfHit || anyChild;
      sec.hidden = !show;
      if(show){ hitStd++; setStd(sec,true); }
    });
    if(!term){ secs.forEach(s=>{ const f=s.querySelector(".files"); if(f) f.hidden=false; }); }
    noRes.classList.toggle("show", !!term && hitStd===0);
    status.textContent = !term ? "" : hitStd ? `النتائج: ${count(hitStd,W_STD)}${hitInd?`، ${count(hitInd,W_IND)}`:""}` : "لا توجد نتائج";
    syncAll();
  };
  q.addEventListener("input", run);
  clr.addEventListener("click", ()=>{ q.value=""; run(); q.focus(); });
  q.addEventListener("keydown", e=>{ if(e.key==="Escape" && q.value){ e.preventDefault(); q.value=""; run(); } });
}


/* ================= تقرير الدورة الأولى ================= */
const LV = ["التميز","التقدم","الانطلاق","التهيئة"];
const pct = n => `${ar(String(+n)).replace(".","٫")}٪`;
function bar(name, value, level){
  return `<div class="bar-row c-${level}"><span class="bn">${esc(name)}</span><span class="bar-track" aria-hidden="true"><i class="bar-fill" style="--w:${value}%"></i></span><span class="bv">${pct(value)}</span></div>`;
}
const levelOf = p => p>=90?"التميز":p>=75?"التقدم":p>=50?"الانطلاق":"التهيئة";
function gauge(p, level){
  /* نصف دائرة: أربعة نطاقات بحدود ٥٠/٧٥/٩٠ كما في التقرير، ومؤشر عند القيمة */
  const cx=140, cy=140, r=110, w=26;
  const pt = (v,rr)=>{ const a=Math.PI*(1-v/100); return [cx+rr*Math.cos(a), cy-rr*Math.sin(a)]; };
  const arc = (a,b,col)=>{ const [x1,y1]=pt(a,r),[x2,y2]=pt(b,r); return `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}" stroke="${col}" stroke-width="${w}" fill="none"/>`; };
  const [nx,ny]=pt(p,44);
  return `<svg viewBox="0 0 280 170" role="img" aria-label="الأداء العام ${pct(p)} — ${level}">
    ${arc(0,50,"var(--lv-h)")}${arc(50,75,"var(--lv-n)")}${arc(75,90,"var(--lv-q)")}${arc(90,100,"var(--lv-t)")}
    <line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="9" fill="var(--ink)"/>
    <text x="${cx}" y="${cy-52}" text-anchor="middle" font-size="40" font-weight="700" fill="var(--ink)" font-family="IBM Plex Sans Arabic, sans-serif">${pct(p)}</text>
  </svg>`;
}
function rpTabs(R){
  const doms = R.domains;
  const tabs = doms.map((d,i)=>`<button class="tab" role="tab" id="tab-${i}" aria-controls="tp-${i}" aria-selected="${i===0}" tabindex="${i===0?0:-1}">${esc(d.name)} <span class="tp">${pct(d.pct)}</span></button>`).join("");
  const panels = doms.map((d,i)=>{
    const counts = Object.fromEntries(LV.map(l=>[l,0])); let total=0;
    d.standards.forEach(s=>s.indicators.forEach(x=>{counts[x.level]++; total++;}));
    const chips = `<button class="chip" data-f="all" aria-pressed="true">الكل <span>${ar(total)}</span></button>` +
      LV.filter(l=>counts[l]).map(l=>`<button class="chip c-${l}" data-f="${l}" aria-pressed="false"><span class="cd"></span>${l} <span>${ar(counts[l])}</span></button>`).join("");
    const stds = d.standards.map(s=>`
      <section class="std-block">
        <h4>${esc(s.name)} <span class="lv lv-${levelOf(s.pct)}">${levelOf(s.pct)}</span><span class="sp">${pct(s.pct)}</span></h4>
        ${s.indicators.map(x=>`
          <article class="rind c-${x.level}" data-lv="${x.level}">
            <div class="rind-top">
              <div><span class="code">${esc(x.code)}</span><p class="rind-text">${esc(x.text)}</p></div>
              <div class="rind-score"><b>${pct(x.pct)}</b><span class="lv lv-${x.level}">${x.level}</span></div>
              <div class="rind-bar" aria-hidden="true"><i style="--w:${x.pct}%"></i></div>
            </div>
            <details><summary>مقترح التحسين ${ic("chev",16)}</summary>
              <p class="finding">${esc(R.findingByLevel[x.level]||"")}</p><p class="rec">${esc(x.recommendation)}</p></details>
          </article>`).join("")}
      </section>`).join("");
    return `<div class="tp-panel" role="tabpanel" id="tp-${i}" aria-labelledby="tab-${i}" ${i?"hidden":""}>
      <p class="dom-desc">${esc(d.desc)}</p>
      <div class="rp-card"><div class="bars">${d.standards.map(s=>bar(s.name,s.pct,levelOf(s.pct))).join("")}</div></div>
      <div class="filters" role="group" aria-label="تصفية المؤشرات حسب المستوى">${chips}</div>
      ${stds}
    </div>`;
  }).join("");
  return {tabs, panels};
}

function bindPlan(){
  const root=document.getElementById("pl-det"); if(!root) return;
  const tabs=[...root.querySelectorAll(".tab")], panels=[...root.querySelectorAll(".tp-panel")];
  const q=document.getElementById("pq"), chips=[...root.querySelectorAll(".chip")], status=document.getElementById("pStatus"), nores=document.getElementById("pNoRes");
  let filter="all";
  const select=(i,focus=true)=>{ tabs.forEach((t,j)=>{t.setAttribute("aria-selected",String(i===j)); t.tabIndex=i===j?0:-1; panels[j].hidden=i!==j;}); if(focus) tabs[i].focus(); apply(); };
  const apply=()=>{
    const term=norm(q.value); let shown=0, perTab=panels.map(()=>0);
    panels.forEach((p,j)=>{
      p.querySelectorAll(".pind").forEach(c=>{ const ok=(filter==="all"||c.dataset.kind===filter)&&(!term||c.dataset.search.includes(term)); c.hidden=!ok; if(ok) perTab[j]++; });
      p.querySelectorAll(".std-block").forEach(b=>b.hidden=![...b.querySelectorAll(".pind")].some(c=>!c.hidden));
    });
    tabs.forEach((t,j)=>{ t.querySelector(".tp").textContent=ar(perTab[j]); });
    const cur=tabs.findIndex(t=>t.getAttribute("aria-selected")==="true");
    shown=perTab[cur];
    const total=perTab.reduce((a,b)=>a+b,0);
    nores.classList.toggle("show", shown===0);
    status.textContent = (term||filter!=="all") ? `النتائج: ${count(total,W_IND)} في جميع المجالات` : "";
  };
  tabs.forEach((t,i)=>{ t.addEventListener("click",()=>select(i)); t.addEventListener("keydown",e=>{
    if(e.key==="ArrowLeft"){e.preventDefault();select((i+1)%tabs.length);} if(e.key==="ArrowRight"){e.preventDefault();select((i-1+tabs.length)%tabs.length);}
    if(e.key==="Home"){e.preventDefault();select(0);} if(e.key==="End"){e.preventDefault();select(tabs.length-1);} }); });
  chips.forEach(c=>c.addEventListener("click",()=>{ filter=c.dataset.f; chips.forEach(x=>x.setAttribute("aria-pressed",String(x===c))); apply(); }));
  q.addEventListener("input",apply);
}

function histChart(h, name){
  const W=340,H=180,L=40,R=30,T=20,B=30, lo=40, hi=80;
  const PX=28; const x = i => L+PX + (W-L-R-2*PX) * (h.length===1?0.5:i/(h.length-1));
  const y = v => T + (H-T-B) * (1-(v-lo)/(hi-lo));
  const grid=[40,50,60,70,80].map(g=>`<line x1="${L}" x2="${W-R}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(g)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${ar(g)}</text>`).join("");
  /* المحور الأفقي من اليسار (الأقدم) إلى اليمين (الأحدث) */
  const pts=h.map((p,i)=>`${x(i)},${y(p.v)}`).join(" ");
  const dots=h.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="5" fill="var(--c)"/><text x="${x(i)}" y="${y(p.v)-10}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${num(p.v)}</text><text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--muted)">${ar(p.year)}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="مستوى أداء المدرسة عبر السنوات في ${esc(name)}: ${h.map(p=>`${ar(p.year)}: ${num(p.v)}`).join("، ")}" style="direction:ltr">${grid}<polyline points="${pts}" fill="none" stroke="var(--c)" stroke-width="2.5" stroke-dasharray="5 4"/>${dots}</svg>`;
}

function findInd(pageKey, code){

function donutSVG(parts, label){
  const total = parts.reduce((a,p)=>a+p.v,0); let acc = 0; const r=70, c=2*Math.PI*r;
  const segs = parts.map((p,i)=>{ const len = c*p.v/total; const seg = `<circle r="${r}" cx="100" cy="100" fill="none" stroke="${p.c}" stroke-width="34" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 100 100)"/>`; acc+=len; return seg; }).join("");
  return `<svg viewBox="0 0 200 200" role="img" aria-label="${esc(label)}">${segs}<text x="100" y="98" text-anchor="middle" font-size="34" font-weight="700" fill="var(--ink)" font-family="IBM Plex Sans Arabic, sans-serif">${ar(total)}</text><text x="100" y="124" text-anchor="middle" font-size="13" fill="var(--muted)" font-family="IBM Plex Sans Arabic, sans-serif">إنجازًا</text></svg>`;
}

function bindAchievements(){
  const reg = document.getElementById("reg"); if(!reg) return;
  const cards=[...reg.querySelectorAll(".ach")], q=document.getElementById("aq"), status=document.getElementById("aStatus"), nores=document.getElementById("aNoRes");
  const state={"المستوى":"","المجال":"",impact:""};
  const apply=()=>{ const t=norm(q.value); let k=0;
    cards.forEach(c=>{ const ok=(!state["المستوى"]||c.dataset.level===state["المستوى"])&&(!state["المجال"]||c.dataset.field===state["المجال"])&&(!state.impact||c.dataset.impact.split(" ").includes(state.impact))&&(!t||c.dataset.search.includes(t)); c.hidden=!ok; if(ok)k++; });
    nores.classList.toggle("show",k===0); status.textContent=(t||state["المستوى"]||state["المجال"]||state.impact)?`المعروض: ${ar(k)} من ${ar(cards.length)}`:""; };
  const setChip=(group,v)=>{ const g=document.querySelector(`[data-group="${group}"]`); if(!g) return; state[group]=v; g.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.v===v))); };
  document.querySelectorAll("[data-group] .chip").forEach(b=>b.addEventListener("click",()=>{ state.impact=""; setChip(b.closest("[data-group]").dataset.group,b.dataset.v); apply(); }));
  q.addEventListener("input",apply);
  const goReg=()=>{ const s=document.getElementById("ac-reg"); s.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); };
  document.querySelectorAll("[data-filter-level]").forEach(b=>b.addEventListener("click",()=>{ state.impact=""; setChip("المجال",""); setChip("المستوى",b.dataset.filterLevel); q.value=""; apply(); goReg(); }));
  document.querySelectorAll("[data-filter-impact]").forEach(b=>b.addEventListener("click",()=>{ setChip("المستوى",""); setChip("المجال",""); state.impact=b.dataset.filterImpact; q.value=""; apply(); goReg(); }));
}

/* ================= ملفات التشكيلات المدرسية ================= */
const W_SUB = ["مجلد فرعي واحد","مجلدان فرعيان","مجلدات فرعية","مجلدًا فرعيًا"];
function fmNode(f, num, path){
  const kids = f.children || [];
  const pid = `fm-${path}`;
  const titles = `<span class="std-num" aria-hidden="true">${ar(num)}</span>
          <span class="std-titles"><span class="std-name">${esc(f.name)}</span>${kids.length?`<span class="std-count">${count(kids.length,W_SUB)}</span>`:""}</span>`;
  const head = kids.length
    ? `<button class="std-toggle" type="button" aria-expanded="false" aria-controls="${pid}">${titles}<span class="std-chev">${ic("chev",20)}</span></button>`
    : `<div class="std-toggle fm-leaf">${titles}</div>`;
  return `<section class="std">
      <div class="std-head">
        ${head}
        <div class="std-link"><a class="btn btn-ghost btn-sm" href="${esc(f.url)}" ${ext} aria-label="فتح المجلد: ${esc(f.name)}">${ic("folder",17)}<span>فتح المجلد</span></a></div>
      </div>
      ${kids.length ? `<div class="std-panel" id="${pid}" hidden><div class="stds fm-sub">${kids.map((c,i)=>fmNode(c,i+1,`${path}-${i+1}`)).join("")}</div></div>` : ""}
    </section>`;
}
function pageFormations(){
  const pg = DATA.pages.formations;

    <h2 class="page-title" tabindex="-1">${esc(pg.title)}</h2>

    <div class="stds" id="fmTree">${(pg.folders||[]).map((f,i)=>fmNode(f,i+1,String(i+1))).join("")}</div>
    <div class="back-row"><a class="btn btn-ghost" href="#/">${ic("back",18)}<span>العودة إلى الرئيسية</span></a></div>`;
}

/* ================= الموجّه ================= */
function route(){
  const path = (location.hash.replace(/^#\/?/,"") || "").replace(/\/+$/,"");
  const [a="", b] = path.split("/");
  /* تحويل الروابط القديمة: ‎#/self-evaluation/<id>‎ ← ‎#/domains/<id>‎ */
  if(a==="self-evaluation" && b){ location.replace(`#/domains/${b}`); return; }
  let html, section = a, scrollTarget = null;
  switch(a){
    case "": html = pageHome(); break;
    case "domains":
      if(b){ html = pageDomain(b); } else { html = pageHome(); scrollTarget = "domains"; }
      section = ""; break;
    case "intro": html = pageContent("intro"); break;
    case "vision": html = pageVision(); break;
    case "achievements": html = pageAchievements(); break;
    case "report-1": html = pageReport1(); break;
    case "plan-1": html = pagePlan1(); break;
    case "self-evaluation": html = pageSelf2(); break;
    case "plan-2": html = pagePlan2(); break;
    case "formations": html = pageFormations(); section = ""; break;
    case "tests": html = b ? pageTestsYear(b) : pageTestsIndex(); section = b ? `tests/${b}` : "tests"; break;
    case "admin": html = pageAdmin(); section = null; break;
    default: html = pageNotFound(); section = null;
  }
  const isHome = a==="" || (a==="domains" && !b);
  document.getElementById("masthead").classList.toggle("compact", !isHome);
  view.innerHTML = html;
  setActive(section);
  bindDomain();
  bindReveal();
  bindReport();
  bindPlan();
  bindAchievements();
  bindFormations();
  closeMenu(false);
  if(scrollTarget){
    const el = document.getElementById(scrollTarget);
    el.scrollIntoView({block:"start"});
    document.getElementById("domH").focus({preventScroll:true});
  } else {
    window.scrollTo(0,0);
    const t = view.querySelector(".page-title");
    if(t && a!=="") t.focus({preventScroll:true});
  }
  const titleBit = isHome ? "" : (view.querySelector(".page-title")?.textContent || "");
  document.title = titleBit ? `${titleBit} | ${DATA.meta.siteTitle}` : DATA.meta.siteTitle;
}

/* ================= القائمة على الجوال ================= */
const sidebar = document.getElementById("sidebar"), scrim = document.getElementById("scrim"), menuBtn = document.getElementById("menuBtn");
const mobileQ = window.matchMedia("(max-width:980px)");
function openMenu(){ sidebar.classList.add("open"); scrim.classList.add("show"); menuBtn.setAttribute("aria-expanded","true"); document.body.style.overflow="hidden"; setTimeout(()=>document.getElementById("sideClose").focus(),60); }
function closeMenu(refocus=true){ if(!sidebar.classList.contains("open")) return; sidebar.classList.remove("open"); scrim.classList.remove("show"); menuBtn.setAttribute("aria-expanded","false"); document.body.style.overflow=""; if(refocus) menuBtn.focus(); }
menuBtn.addEventListener("click", openMenu);
scrim.addEventListener("click", ()=>closeMenu());
document.getElementById("sideClose").addEventListener("click", ()=>closeMenu());
document.addEventListener("keydown", e=>{
  if(!sidebar.classList.contains("open")) return;
  if(e.key==="Escape"){ closeMenu(); return; }
  if(e.key==="Tab" && mobileQ.matches){ /* حصر التركيز داخل الدرج */
    const f = [...sidebar.querySelectorAll("a,button")]; const first=f[0], last=f[f.length-1];
    if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
  }
});
mobileQ.addEventListener?.("change", ()=>{ if(!mobileQ.matches) closeMenu(false); });

/* ================= عارض الصور ================= */
const lb = document.getElementById("lightbox"), lbImg = document.getElementById("lbImg"), lbStage = document.getElementById("lbStage"), lbZoom = document.getElementById("lbZoom");
let lbReturn = null;
function setZoom(on){ lbStage.classList.toggle("zoomed",on); lbZoom.setAttribute("aria-pressed",String(on)); lbZoom.textContent = on ? "ملاءمة الشاشة" : "تكبير"; }
let lbList = [], lbIdx = 0;
const lbPrev = document.getElementById("lbPrev"), lbNext = document.getElementById("lbNext");
function lbShow(el){ lbImg.src = asset(el.dataset.zoom); lbImg.alt = el.dataset.title || ""; document.getElementById("lbTitle").textContent = el.dataset.title || ""; setZoom(false); }
function lbStep(d){ if(lbList.length<2) return; lbIdx = (lbIdx + d + lbList.length) % lbList.length; lbShow(lbList[lbIdx]); }
document.addEventListener("click", e=>{
  const z = e.target.closest("[data-zoom]"); if(!z) return;
  lbReturn = z;
  lbList = z.dataset.gal ? [...document.querySelectorAll(`[data-gal="${z.dataset.gal}"]`)].filter(x=>x.offsetParent!==null) : [z];
  lbIdx = Math.max(0, lbList.indexOf(z));
  lbPrev.hidden = lbNext.hidden = lbList.length < 2;
  lbShow(z);
  if (typeof lb.showModal === "function") lb.showModal(); else lb.setAttribute("open","");
  document.getElementById("lbClose").focus();
});
lbPrev.addEventListener("click", ()=>lbStep(-1));
lbNext.addEventListener("click", ()=>lbStep(1));
lb.addEventListener("keydown", e=>{ if(e.key==="ArrowLeft"){ e.preventDefault(); lbStep(1); } if(e.key==="ArrowRight"){ e.preventDefault(); lbStep(-1); } });
lbZoom.addEventListener("click", ()=>setZoom(!lbStage.classList.contains("zoomed")));
lbImg.addEventListener("click", ()=>setZoom(!lbStage.classList.contains("zoomed")));
lbStage.addEventListener("click", e=>{ if(e.target===lbStage) lb.close(); });
document.getElementById("lbClose").addEventListener("click", ()=>lb.close());
lb.addEventListener("close", ()=>{ lbImg.removeAttribute("src"); if(lbReturn){ lbReturn.focus(); lbReturn=null; } });

/* فتح الملف الأصلي: عند تشغيل الصفحة من الجهاز (file:) تُستخدم النسخة المضمنة إن وجدت */
const pdfCache = {};
document.addEventListener("click", e=>{
  const a = e.target.closest("a[data-pdf]"); if(!a) return;
  const key = a.dataset.pdf, b64 = window.__PDFS__ && window.__PDFS__[key];
  const remoteUnreachable = location.protocol === "file:" || location.protocol === "blob:" || location.origin === "null";
  if(!b64 || !remoteUnreachable) return;
  e.preventDefault();
  if(!pdfCache[key]){
    const bin = atob(b64), bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    pdfCache[key] = URL.createObjectURL(new Blob([bytes], {type:"application/pdf"}));
  }
  const w = window.open(pdfCache[key], "_blank");
  if(!w) location.href = pdfCache[key];
});
document.getElementById("skipLink").addEventListener("click", e=>{ e.preventDefault(); view.focus(); });

  view.innerHTML = emptyState("تعذر تحميل المحتوى", err.message, "info");
});
